# jira-local-mcp 配置模板
# 复制为 config.yaml 并填写真实值。config.yaml 已被 .gitignore 忽略，切勿提交。

jira:
  # JIRA Server / Data Center 实例地址，如 https://jira.example.com
  url: "https://jira.example.com"
  # 认证方式：pat（Personal Access Token，推荐）或 basic（用户名+密码）
  auth_type: "pat"
  # auth_type=pat 时填写
  token: "YOUR_PERSONAL_ACCESS_TOKEN"
  # auth_type=basic 时填写
  username: ""
  password: ""
  # 是否校验 TLS 证书（自签名证书环境可设为 false）
  verify_ssl: true
  # 单次 API 调用超时（秒）
  timeout: 30

web:
  # Web 确认页默认端口，冲突时自动递增
  port: 8766

queue:
  # 待执行任务过期时长（分钟）
  expire_minutes: 30
  # 单个确认批次最多容纳的任务数；达到上限后自动切换到新批次
  max_tasks_per_batch: 20

files:
  # description_file 等本地 txt 文件读取的大小上限（字节），默认 256KB
  max_txt_bytes: 262144

log:
  # 审计日志与运行日志目录，相对路径以项目根为基准
  dir: "data"
  # 保留的历史提交记录条数
  commit_log_keep: 200
