<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jira Operation 审核</title>
    <link rel="stylesheet" href="/static/confirm.css" />
  </head>
  <body>
    <header>
      <h1>Jira Operation 审核</h1>
      <p>所有写入必须在本页面明确提交；入队和打开页面均不代表已执行。</p>
    </header>
    <main>
      <section class="panel" id="queue-panel">
        <div class="panel-title">
          <h2>实时审核队列</h2>
          <span id="queue-revision"></span>
        </div>
        <div class="actions">
          <button id="select-all">全选</button
          ><button id="submit-selected" class="primary">提交勾选</button>
          <button id="cancel-selected" class="danger">取消勾选</button
          ><span id="queue-message"></span>
        </div>
        <div id="queue-content"></div>
      </section>
      <section class="panel">
        <h2>暂存与阻塞</h2>
        <div id="staging-content"></div>
      </section>
      <section class="panel">
        <h2>执行中</h2>
        <div id="executing-content"></div>
      </section>
      <section class="panel">
        <div class="panel-title">
          <h2>执行历史</h2>
          <div>
            <label>本地日期 <input id="history-date" type="date" /></label
            ><button id="history-refresh">查询</button>
          </div>
        </div>
        <div id="history-content"></div>
        <div class="actions">
          <button id="history-prev">上一页</button
          ><span id="history-page"></span
          ><button id="history-next">下一页</button>
        </div>
      </section>
    </main>
    <script src="/static/confirm.js" defer></script>
  </body>
</html>
