<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIRA 变更确认 · jira-local-mcp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden {
      display: none;
    }

    .risk-low {
      border-left: 4px solid #9ca3af;
    }

    .risk-medium {
      border-left: 4px solid #f59e0b;
      background: #fffbeb;
    }

    .risk-high {
      border-left: 4px solid #ef4444;
      background: #fef2f2;
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-800">
  <div id="app" class="max-w-5xl mx-auto p-4">
    <header class="mb-4">
      <h1 class="text-2xl font-bold">JIRA 变更确认</h1>
      <p class="text-sm text-gray-500">
        所有修改仅在你确认后才真实执行 · 本页面地址仅本机可访问 · 删除操作永久禁用
      </p>
    </header>
    <div id="execution-busy" class="hidden mb-4 rounded border border-amber-300 bg-amber-50 px-4 py-3 text-amber-800">
      已有批次正在执行，完成后页面将自动恢复为可提交状态。
    </div>
    <div id="attention" class="hidden mb-6 rounded border-2 border-red-300 bg-red-50 p-4">
      <h2 class="text-lg font-bold text-red-800">需要人工对账</h2>
      <p class="mt-1 text-sm text-red-700">
        以下任务执行期间服务异常退出，无法确定 Jira 是否已经生效。请先到 Jira 核实；系统不会自动重试。
      </p>
      <div id="attention-tasks" class="mt-3"></div>
    </div>
    <div id="batches"></div>
    <div id="empty" class="hidden text-center text-gray-400 py-16">
      当前没有待确认的变更任务。
    </div>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-red-600 mb-2">⚠️ 高危操作二次确认</h3>
      <p class="text-sm text-gray-600 mb-2">本次提交包含以下高危操作：</p>
      <ul id="modal-list" class="text-sm list-disc pl-5 mb-4 text-red-700 max-h-48 overflow-auto"></ul>
      <div class="flex justify-end gap-2">
        <button id="modal-cancel" class="px-4 py-2 rounded bg-gray-200">取消</button>
        <button id="modal-confirm" class="px-4 py-2 rounded bg-red-600 text-white">确认执行</button>
      </div>
    </div>
  </div>

  <script>
    const RISK_LABEL = { low: "低", medium: "中", high: "高" };
    const container = document.getElementById("batches");
    const empty = document.getElementById("empty");
    const executionBusyBanner = document.getElementById("execution-busy");
    const attention = document.getElementById("attention");
    const attentionTasks = document.getElementById("attention-tasks");
    const stateByBatch = new Map();
    const cardsByBatch = new Map();
    const currentBatches = new Map();
    const submittingByBatch = new Set();
    let executionBusy = false;
    let pendingSubmit = null;

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = String(text);
      return element;
    }

    function makeButton(label, className) {
      const button = makeElement("button", className, label);
      button.type = "button";
      return button;
    }

    function ensureState(batch) {
      const ids = batch.tasks.map(task => task.task_id);
      let state = stateByBatch.get(batch.batch_id);
      if (!state) {
        state = { order: [...ids], checked: new Set(ids), nonceInput: "" };
        stateByBatch.set(batch.batch_id, state);
      } else {
        const available = new Set(ids);
        state.order = state.order.filter(id => available.has(id));
        for (const id of [...state.checked]) {
          if (!available.has(id)) state.checked.delete(id);
        }
        const known = new Set(state.order);
        for (const id of ids) {
          if (!known.has(id)) {
            state.order.push(id);
            state.checked.add(id);
          }
        }
      }
      return state;
    }

    function riskBadgeClass(risk) {
      if (risk === "high") return "bg-red-100 text-red-700";
      if (risk === "medium") return "bg-amber-100 text-amber-700";
      return "bg-gray-100 text-gray-600";
    }

    function createTaskRow(batchId, task) {
      const risk = Object.hasOwn(RISK_LABEL, task.risk_level) ? task.risk_level : "low";
      const row = makeElement("div", `risk-${risk} rounded px-3 py-2 mb-2 flex items-start gap-3`);
      row.dataset.taskId = task.task_id;

      const checkbox = makeElement("input", "chk mt-1");
      checkbox.type = "checkbox";
      checkbox.dataset.batchId = batchId;
      checkbox.dataset.taskId = task.task_id;
      checkbox.addEventListener("change", () => {
        const state = stateByBatch.get(batchId);
        if (checkbox.checked) state.checked.add(task.task_id);
        else state.checked.delete(task.task_id);
      });
      row.appendChild(checkbox);

      const content = makeElement("div", "flex-1");
      const meta = makeElement("div", "flex items-center gap-2");
      meta.appendChild(makeElement(
        "span",
        `text-xs px-2 py-0.5 rounded ${riskBadgeClass(risk)}`,
        `${RISK_LABEL[risk]}危`,
      ));
      meta.appendChild(makeElement("span", "text-xs text-gray-400", task.operation_type));
      if (task.issue_key) {
        meta.appendChild(makeElement("span", "text-xs text-blue-600", task.issue_key));
      }
      content.appendChild(meta);
      content.appendChild(makeElement("div", "text-sm mt-1", task.description));

      const details = makeElement("details", "mt-1");
      details.appendChild(makeElement("summary", "text-xs text-gray-400 cursor-pointer", "详情"));
      const payload = makeElement("pre", "text-xs bg-gray-50 p-2 rounded mt-1 overflow-auto");
      payload.textContent = JSON.stringify(task.payload, null, 2);
      details.appendChild(payload);
      content.appendChild(details);
      row.appendChild(content);

      const controls = makeElement("div", "flex flex-col gap-1");
      const up = makeButton("↑", "mv text-xs px-1");
      const down = makeButton("↓", "mv text-xs px-1");
      up.dataset.direction = "-1";
      down.dataset.direction = "1";
      const move = direction => {
        const state = stateByBatch.get(batchId);
        const index = state.order.indexOf(task.task_id);
        const target = index + direction;
        if (target < 0 || target >= state.order.length) return;
        [state.order[index], state.order[target]] = [state.order[target], state.order[index]];
        updateBatch(currentBatches.get(batchId));
      };
      up.addEventListener("click", () => move(-1));
      down.addEventListener("click", () => move(1));
      controls.append(up, down);
      row.appendChild(controls);
      return { element: row, checkbox, up, down };
    }

    function createBatchCard(batch) {
      const card = makeElement("section", "bg-white rounded-lg shadow mb-6 p-4");
      card.dataset.batchId = batch.batch_id;
      const header = makeElement("div", "flex items-center justify-between mb-3");
      const titleArea = makeElement("div");
      titleArea.appendChild(makeElement("div", "font-semibold", `批次 ${batch.batch_id}`));
      const recoveryLabel = makeElement(
        "div",
        "recovery-label mt-1 text-xs font-medium text-amber-700",
        "人工对账恢复批次 · 仅包含确认未生效的恢复任务",
      );
      recoveryLabel.classList.toggle("hidden", batch.kind !== "recovery");
      titleArea.appendChild(recoveryLabel);
      const counts = makeElement("div", "text-xs text-gray-500");
      titleArea.appendChild(counts);
      header.appendChild(titleArea);
      const nonceArea = makeElement("div", "text-right");
      nonceArea.appendChild(makeElement("div", "text-xs text-gray-500", "验证码"));
      const nonceDisplay = makeElement("div", "font-mono text-lg tracking-widest text-indigo-600");
      nonceArea.appendChild(nonceDisplay);
      header.appendChild(nonceArea);
      card.appendChild(header);

      const rows = makeElement("div");
      card.appendChild(rows);
      const actions = makeElement("div", "flex flex-wrap items-center gap-2 mt-4 border-t pt-3");
      const nonceInput = makeElement("input", "nonce border rounded px-3 py-1.5 font-mono w-40");
      nonceInput.type = "text";
      nonceInput.placeholder = "输入验证码";
      nonceInput.maxLength = 8;
      nonceInput.autocomplete = "off";
      nonceInput.value = stateByBatch.get(batch.batch_id).nonceInput;
      nonceInput.addEventListener("input", () => {
        const state = stateByBatch.get(batch.batch_id);
        if (state) state.nonceInput = nonceInput.value;
      });
      const submitChecked = makeButton("仅提交勾选", "px-4 py-1.5 rounded bg-indigo-600 text-white");
      const submitAll = makeButton("全部确认", "px-4 py-1.5 rounded bg-green-600 text-white");
      const cancel = makeButton("全部取消", "px-4 py-1.5 rounded bg-gray-200");
      const result = makeElement("span", "result text-sm ml-2");
      submitChecked.addEventListener("click", () => onSubmit(batch.batch_id, "checked"));
      submitAll.addEventListener("click", () => onSubmit(batch.batch_id, "all"));
      cancel.addEventListener("click", () => onCancel(batch.batch_id));
      actions.append(nonceInput, submitChecked, submitAll, cancel, result);
      card.appendChild(actions);
      const executionResult = makeElement("div", "exec-result mt-3");
      card.appendChild(executionResult);
      container.appendChild(card);

      const record = {
        element: card, counts, recoveryLabel, nonceDisplay, rows, nonceInput, result,
        executionResult, taskRows: new Map(),
        actionButtons: [submitChecked, submitAll, cancel],
      };
      cardsByBatch.set(batch.batch_id, record);
      return record;
    }

    function updateBatch(batch) {
      if (!batch) return;
      const state = ensureState(batch);
      const record = cardsByBatch.get(batch.batch_id) || createBatchCard(batch);
      const highCount = batch.tasks.filter(task => task.risk_level === "high").length;
      record.counts.textContent = `共 ${batch.tasks.length} 条 · 高危 ${highCount} 条`;
      record.recoveryLabel.classList.toggle("hidden", batch.kind !== "recovery");
      record.nonceDisplay.textContent = batch.nonce;

      const taskMap = new Map(batch.tasks.map(task => [task.task_id, task]));
      for (const [taskId, row] of record.taskRows) {
        if (!taskMap.has(taskId)) {
          row.element.remove();
          record.taskRows.delete(taskId);
        }
      }
      state.order.forEach((taskId, index) => {
        const task = taskMap.get(taskId);
        if (!task) return;
        let row = record.taskRows.get(taskId);
        if (!row) {
          row = createTaskRow(batch.batch_id, task);
          record.taskRows.set(taskId, row);
        }
        row.checkbox.checked = state.checked.has(taskId);
        row.checkbox.disabled = executionBusy;
        row.up.disabled = executionBusy || index === 0;
        row.down.disabled = executionBusy || index === state.order.length - 1;
        record.rows.appendChild(row.element);
      });
      setBatchSubmitting(batch.batch_id, executionBusy);
    }

    function createAttentionRow(task) {
      const row = makeElement("article", "mb-3 rounded border border-red-200 bg-white p-3");
      const meta = makeElement("div", "flex flex-wrap items-center gap-2 text-xs text-gray-500");
      meta.appendChild(makeElement("span", "font-mono", task.task_id));
      meta.appendChild(makeElement("span", "", task.operation_type));
      if (task.issue_key) meta.appendChild(makeElement("span", "text-blue-600", task.issue_key));
      row.appendChild(meta);
      row.appendChild(makeElement("div", "mt-1 text-sm", task.description));
      const reserved = task.execution_reserved_at
        ? new Date(task.execution_reserved_at * 1000).toLocaleString()
        : "未知";
      row.appendChild(makeElement("div", "mt-1 text-xs text-red-700", `预留执行时间：${reserved}`));

      const details = makeElement("details", "mt-2");
      details.appendChild(makeElement("summary", "cursor-pointer text-xs text-gray-500", "查看原始任务详情"));
      const payload = makeElement("pre", "mt-1 overflow-auto rounded bg-gray-50 p-2 text-xs");
      payload.textContent = JSON.stringify(task.payload, null, 2);
      details.appendChild(payload);
      row.appendChild(details);

      const actions = makeElement("div", "mt-3 flex flex-wrap gap-2");
      const succeeded = makeButton("确认已在 Jira 生效", "rounded bg-green-600 px-3 py-1.5 text-sm text-white");
      const notApplied = makeButton("确认未生效", "rounded bg-amber-500 px-3 py-1.5 text-sm text-white");
      const abandoned = makeButton("放弃并归档", "rounded bg-gray-500 px-3 py-1.5 text-sm text-white");
      const result = makeElement("span", "self-center text-sm");
      const buttons = [succeeded, notApplied, abandoned];
      succeeded.addEventListener("click", () => resolveIndeterminate(task, "succeeded", buttons, result));
      notApplied.addEventListener("click", () => resolveIndeterminate(task, "not_applied", buttons, result));
      abandoned.addEventListener("click", () => resolveIndeterminate(task, "abandoned", buttons, result));
      actions.append(succeeded, notApplied, abandoned, result);
      row.appendChild(actions);
      return row;
    }

    function renderAttention(tasks) {
      attention.classList.toggle("hidden", tasks.length === 0);
      attentionTasks.replaceChildren(...tasks.map(createAttentionRow));
    }

    function render(batches, attentionRequired = []) {
      const seen = new Set();
      batches.forEach((batch, index) => {
        seen.add(batch.batch_id);
        currentBatches.set(batch.batch_id, batch);
        updateBatch(batch);
        const card = cardsByBatch.get(batch.batch_id).element;
        const cardAtIndex = container.children[index];
        if (cardAtIndex !== card) container.insertBefore(card, cardAtIndex || null);
      });
      for (const [batchId, record] of cardsByBatch) {
        if (!seen.has(batchId)) {
          record.element.remove();
          cardsByBatch.delete(batchId);
          stateByBatch.delete(batchId);
          currentBatches.delete(batchId);
        }
      }
      renderAttention(attentionRequired);
      empty.classList.toggle("hidden", batches.length !== 0 || attentionRequired.length !== 0);
    }

    async function fetchQueue() {
      const response = await fetch("/api/queue/all");
      if (!response.ok) return;
      const data = await response.json();
      render(
        Array.isArray(data.batches) ? data.batches : [],
        Array.isArray(data.attention_required) ? data.attention_required : [],
      );
      setExecutionBusy(data.execution_busy === true);
    }

    async function resolveIndeterminate(task, resolution, buttons, result) {
      const prompts = {
        succeeded: "确认已在 Jira 核实该操作生效？此结论只归档任务，不会再次写入 Jira。",
        not_applied: "确认已在 Jira 核实该操作未生效？系统将生成一个新的待确认恢复批次，仍需再次输入该批次的验证码后才会执行。",
        abandoned: "确认放弃该任务并归档？系统不会执行或重试它。",
      };
      if (!confirm(prompts[resolution])) return;
      for (const button of buttons) button.disabled = true;
      result.textContent = "处理中…";
      try {
        const response = await fetch("/api/indeterminate/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            batch_id: task.batch_id,
            task_id: task.task_id,
            resolution,
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          result.textContent = `❌ ${data.error || data.detail || "处置失败"}`;
          for (const button of buttons) button.disabled = false;
          return;
        }
        await fetchQueue();
      } catch (error) {
        result.textContent = "❌ 网络请求失败";
        for (const button of buttons) button.disabled = false;
      }
    }

    function setResult(record, message, className) {
      record.result.textContent = message;
      record.result.className = `result text-sm ml-2 ${className}`;
    }

    function setBatchSubmitting(batchId, submitting) {
      const record = cardsByBatch.get(batchId);
      if (!record) return;
      record.nonceInput.disabled = submitting;
      for (const button of record.actionButtons) button.disabled = submitting;
      for (const row of record.taskRows.values()) {
        row.checkbox.disabled = submitting;
        row.up.disabled = submitting || row.up.disabled;
        row.down.disabled = submitting || row.down.disabled;
      }
    }

    function setExecutionBusy(busy) {
      executionBusy = busy;
      executionBusyBanner.classList.toggle("hidden", !busy);
      for (const batchId of cardsByBatch.keys()) setBatchSubmitting(batchId, busy);
      if (!busy) {
        for (const batch of currentBatches.values()) updateBatch(batch);
      }
    }

    function onSubmit(batchId, mode) {
      const state = stateByBatch.get(batchId);
      const record = cardsByBatch.get(batchId);
      if (executionBusy) {
        setResult(record, "当前有批次正在执行，请等待完成后再提交", "text-amber-700");
        return;
      }
      const ids = state.order.filter(id => mode === "all" || state.checked.has(id));
      const nonce = record.nonceInput.value.trim();
      if (!ids.length) {
        setResult(record, "未选择任何任务", "text-red-600");
        return;
      }
      if (!nonce) {
        setResult(record, "请输入验证码", "text-red-600");
        return;
      }
      const batch = currentBatches.get(batchId);
      const selected = new Set(ids);
      const highTasks = batch.tasks.filter(
        task => selected.has(task.task_id) && task.risk_level === "high",
      );
      const submit = () => submitBatch(batchId, ids, nonce);
      if (!highTasks.length) {
        submit();
        return;
      }
      const list = document.getElementById("modal-list");
      list.replaceChildren(...highTasks.map(task => makeElement("li", "", task.description)));
      pendingSubmit = submit;
      document.getElementById("modal").classList.remove("hidden");
    }

    async function submitBatch(batchId, ids, nonce) {
      if (executionBusy && !submittingByBatch.has(batchId)) {
        const busyRecord = cardsByBatch.get(batchId);
        setResult(busyRecord, "当前有批次正在执行，请等待完成后再提交", "text-amber-700");
        return;
      }
      if (submittingByBatch.has(batchId)) return;
      submittingByBatch.add(batchId);
      const record = cardsByBatch.get(batchId);
      setExecutionBusy(true);
      try {
        setResult(record, "执行中…", "text-gray-500");
        const response = await fetch("/api/commit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ batch_id: batchId, task_ids: ids, nonce }),
        });
        const data = await response.json();
        if (!response.ok) {
          setResult(record, `❌ ${data.error || data.detail || "提交失败"}`, "text-red-600");
          return;
        }
        setResult(record, `✅ 成功 ${data.ok_count} · 失败 ${data.fail_count}`, "text-green-700");
        renderExecutionResult(record.executionResult, data.results || []);
        await fetchQueue();
      } catch (error) {
        setResult(record, "❌ 网络请求失败", "text-red-600");
      } finally {
        submittingByBatch.delete(batchId);
        await fetchQueue();
      }
    }

    function renderExecutionResult(box, results) {
      const children = [makeElement("div", "text-sm font-semibold mb-1", "执行结果")];
      for (const result of results) {
        const success = result.status === "success";
        const row = makeElement(
          "div",
          `text-xs px-2 py-1 rounded mb-1 ${success ? "bg-green-50 text-green-800" : "bg-red-50 text-red-800"}`,
        );
        const key = result.new_issue_key ? ` → ${result.new_issue_key}` : "";
        const detail = success ? (result.summary || "") : (result.error || "");
        row.textContent = `[${success ? "✓" : "✗"}] ${result.operation_type || ""}${key} ${detail}`;
        children.push(row);
      }
      box.replaceChildren(...children);
    }

    async function onCancel(batchId) {
      if (executionBusy) return;
      if (!confirm("确认取消该批次全部任务？（仅清空队列，不影响 JIRA）")) return;
      const response = await fetch("/api/cancel", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ batch_id: batchId }),
      });
      if (response.ok) await fetchQueue();
    }

    document.getElementById("modal-cancel").addEventListener("click", () => {
      document.getElementById("modal").classList.add("hidden");
      pendingSubmit = null;
    });
    document.getElementById("modal-confirm").addEventListener("click", () => {
      document.getElementById("modal").classList.add("hidden");
      if (pendingSubmit) pendingSubmit();
      pendingSubmit = null;
    });

    fetchQueue();
    setInterval(fetchQueue, 3000);
  </script>
</body>

</html>
